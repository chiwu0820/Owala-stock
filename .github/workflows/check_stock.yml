name: Owala Stock Checker

on:
  schedule:
    # 每 15 分鐘自動執行一次
    - cron: '*/15 * * * *'
  workflow_dispatch: # 允許手動點擊按鈕觸發執行

jobs:
  check-stock:
    runs-on: ubuntu-latest

    steps:
    - name: 檢出程式碼
      uses: actions/checkout@v3

    - name: 設定 Python 環境
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 安裝依賴套件
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: 執行庫存檢查腳本
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: python owala_checker.py
